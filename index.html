<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inhistoria Photography — Gallery Client Portal</title>
  <script>
    // Jika URL memiliki parameter project (?p=...), langsung arahkan ke gallery klien
    const urlParams = new URLSearchParams(window.location.search);
    const pParam = urlParams.get('p') || window.location.hash.replace('#p=', '');
    if (pParam) {
      window.location.replace('gallery.html?p=' + encodeURIComponent(pParam));
    } else {
      window.location.replace('dashboard.html');
    }
  </script>
</head>
<body style="background: #0b0d11; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Membuka Inhistoria Photography...</p>
</body>
</html>
